name: Repository hygiene
on:
  push:
    branches: [main, "feat/**", "fix/**", "docs/**", "chore/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repo-hygiene-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python scripts/check_repo.py
      - name: Validate deployment scripts
        run: |
          bash -n scripts/deploy.sh
          python -m py_compile scripts/poll-deployment.py
          shellcheck scripts/deploy.sh
      - run: python -m unittest discover -s tests -p "test_repo_policy.py" -v
      - run: python -m unittest discover -s tests -p "test_deployment.py" -v
  app-tests:
    name: App tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IUMON_DATA_DIR: /tmp/iumon-test-data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: pip install -r app/requirements.txt
      - name: Prepare synthetic data
        run: |
          mkdir -p "$IUMON_DATA_DIR"
          cp tests/fixtures/snapshot.json "$IUMON_DATA_DIR/snapshot.json"
      - run: python -m unittest discover -s app -p 'test_*.py' -v
      - run: python -m unittest discover -s gpu -p 'test_*.py' -v
      - run: node --check app/static/app.js && node --check app/static/journey.js && node --check app/static/voice.js
      - run: node --test tests/voice.test.cjs
  docker-smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: docker build -t iumon-ci .
      - name: Check image and HTTP health without credentials
        run: |
          docker run --rm --entrypoint python iumon-ci -c "from pathlib import Path; assert not any(p.name == '.env' or p.name.endswith('.env') for p in Path('/srv/app').rglob('*'))"
          docker run -d --name iumon-ci --read-only \
            --tmpfs /srv/app/data:uid=10001,gid=10001 --tmpfs /tmp \
            -e AUTO_REFRESH=0 -p 127.0.0.1:18765:8765 iumon-ci
          curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://127.0.0.1:18765/api/health
          curl --fail http://127.0.0.1:18765/api/status > /dev/null
      - if: always()
        run: docker rm -f iumon-ci || true
